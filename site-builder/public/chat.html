<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site builder</title>
  <link rel="stylesheet" href="/shared.css" />
</head>
<body class="chat-layout">
  <aside class="sidebar">
    <a class="back" href="/">&larr; Agents</a>
    <button id="new-chat" class="primary">New chat</button>
    <nav id="sessions"></nav>
  </aside>

  <main class="chat-main">
    <header class="topbar">
      <div class="brand" id="instance-label"></div>
      <a id="site-link" target="_blank" rel="noopener" hidden>Open site &nearr;</a>
    </header>
    <div id="messages" class="messages"></div>
    <div id="starters" class="starters" hidden>
      <button class="starter" data-starter>Create a simple Hello World page and give me a link to check it out.</button>
      <button class="starter" data-starter>Build me a one-page personal site with an About and a Contact section, publish it, and send me the link.</button>
      <button class="starter" data-starter>Make a landing page for a coffee subscription called Daily Grind, then share the URL.</button>
    </div>
    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="Describe the website you want..." required></textarea>
      <button id="send" class="primary" type="submit">Send</button>
      <button id="stop" type="button" hidden>Stop</button>
    </form>
  </main>

  <script src="/chat.js"></script>
</body>
</html>
