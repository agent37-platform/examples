<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site builder · Agents</title>
  <link rel="stylesheet" href="/shared.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Site builder <span class="muted">· Agent37 example</span></div>
    <button id="create" class="primary">Create agent</button>
  </header>

  <main class="page">
    <p class="muted note" id="status"></p>
    <table id="instances" hidden>
      <thead>
        <tr><th>Name</th><th>ID</th><th>Status</th><th>Site</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="empty" class="empty" hidden>
      <h2>No agents yet</h2>
      <p>Create one, then ask it for a website. The smallest instance costs $4.94 per month from your wallet, metered per minute while you hold it; deleting it ends billing on the spot.</p>
    </div>
  </main>

  <script src="/instances.js"></script>
</body>
</html>
